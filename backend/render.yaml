services:
  - type: web
    name: covenant-escrow-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "bash start.sh"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "covenant-escrow-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GENLAYER_CONTRACT_ADDRESS
        sync: false
      - key: SIWE_EXPECTED_DOMAIN
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
