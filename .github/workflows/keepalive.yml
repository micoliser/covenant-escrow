name: Keep Render Server Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -sSf https://covenant-escrow-api.onrender.com/api/daos/ > /dev/null
